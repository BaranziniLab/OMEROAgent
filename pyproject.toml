[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omeroagent"
version = "0.2.0"
description = "Retired. This extension no longer calls OMERO and only reports that it is retired. Remove it."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Baranzini Lab", email = "wanjun.gu@ucsf.edu"}]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.0,<5",
    "httpx>=0.28.1,<1",
    "pydantic>=2.11.7,<3",
]

[project.scripts]
omeroagent = "omeroagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omeroagent"]

[tool.uv]
# cryptography (pulled in by fastmcp) has no Intel Mac wheels from 49 on.
constraint-dependencies = [
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
