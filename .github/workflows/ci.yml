# Generated by the Biorouter BRXT adapter kit 1.0.0.
name: Extension checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
      - name: The lock matches pyproject.toml
        run: uv lock --check
      - run: uv sync --locked --python 3.13
      - name: Contract tests (vendored kit, lock, release rules, start probe, leak suite)
        run: uv run python -m unittest discover -s tests -v
      - name: Build the bundle
        run: uv run python scripts/build_brxt.py
